# Render Blueprint Specification for SUNDARAM PREP
# Web Service (Flask + Gunicorn) & Static Site (React + Vite)
services:
  # -----------------------------------------------------------------
  # 1. Sundaram Prep Backend API
  # -----------------------------------------------------------------
  - type: web
    name: sundaram-prep-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && flask db upgrade || echo 'Migrations skipped or already current'"
    startCommand: "gunicorn \"app:create_app()\" --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_REASONING_MODEL
        value: o3-mini
      - key: OPENAI_FAST_MODEL
        value: gpt-4o-mini
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Sundaram Prep <no-reply@sundaramprep.com>
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "Lax"
      - key: FRONTEND_URL
        value: https://sundaram-prep.onrender.com
      - key: CORS_ORIGINS
        value: https://sundaram-prep.onrender.com,http://localhost:5173

  # -----------------------------------------------------------------
  # 2. Sundaram Prep Frontend Application
  # -----------------------------------------------------------------
  - type: static
    name: sundaram-prep
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://sundaram-prep-api.onrender.com
